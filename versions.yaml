# Machine-readable version manifest for ethernetip-interop.
# Upstream pins and base image digests are release inputs; nothing floats.
# The Dockerfiles, adapters/opener/capabilities.json and the
# requirements.txt of the Python adapters are the source of truth for a
# build: scripts/check-versions.sh fails when this file disagrees with them.

interop_version: "0.3.0"
contract_version: "1.0"        # docs/CONTAINER_CONTRACT.md; documents carry schemaVersion "1.0", the compatible line
fixture_schema: "1.0"          # fixtures/schema/ethernetip-fixture.schema.json

protocol:
  name: "EtherNet/IP (CIP over TCP/UDP)"
  explicit_port: 44818         # TCP and UDP: encapsulation, explicit messaging
  io_port: 2222                # UDP: Class 0/1 I/O

implementations:
  opener:
    priority: P0
    status: implemented
    upstream: "OpENer"
    repository: "https://github.com/EIPStackGroup/OpENer"
    version: "2.3-588"           # master, git describe v2.3-588-gd8820ef; no release since v2.3
    revision: "d8820ef41ce30dda06d213438ba81c81de33ffe2"
    source_sha256: "6c34be6bfe294351a69544722079751f96cdc24ac1a43337dd3e22d843f5b95b"   # GitHub archive of the commit
    license: "adapted BSD (OpENer license.txt), (c) Rockwell Automation; requires ODVA Terms of Usage for products"
    language: "C"
    independent_engine: true
    roles: [server]
    published: true
    note: >-
      The POSIX sample application: identity and assemblies are compiled in,
      so the adapter serves the opener-sample fixture only. The only stack
      here with Class 1 I/O as a target.

  eipscanner:
    priority: P0
    status: implemented
    upstream: "EIPScanner"
    repository: "https://github.com/nimbuscontrols/EIPScanner"
    version: "1.3.0-33"          # master, 33 commits after tag 1.3.0
    revision: "12c89a57ec2e7449efb1348be52af10be9ef9701"
    source_sha256: "3efbb95bff91501328b5899dd635cfee61ec11f59f3ad7609812fb65211ddc63"   # GitHub archive of the commit
    license: "MIT"
    language: "C++"
    independent_engine: true
    roles: [client]
    published: true
    note: "Scanner: explicit messaging and Class 1 I/O as originator; no Class 3, no multicast."

  cpppo:
    priority: P1
    status: implemented
    upstream: "cpppo"
    repository: "https://github.com/pjkundert/cpppo"
    package: "cpppo"
    version: "5.2.5"             # PyPI wheel
    revision: "f7c224bbb2389bd26d0088eeb1a93db3a5c4858f"   # tag commit
    wheel_sha256: "0257ba393f1e2bdd06ea712cead740e496c802b3e5275c1995ee2df31f29ed1c"
    license: "GPL-3.0"
    language: "Python"
    independent_engine: true
    roles: [server, client]
    published: true
    dependencies:
      greenery: "2.1 sdist sha256 759c3bf40b6fe6ef0a6b373230d07470e0e315f32bcdbaf381901b0d8a6f91d1 (MIT)"
    note: >-
      Logix-style simulator and originator, no Class 1 I/O. The adapter
      imports cpppo and is GPL-3.0-or-later; the image is GPL-3.0 as a whole.

  pycomm3:
    priority: P1
    status: implemented
    upstream: "pycomm3"
    repository: "https://github.com/ottowayi/pycomm3"
    package: "pycomm3"
    version: "1.2.16"            # PyPI wheel
    revision: "36aeb19b5cb47495df9fd1caa38ce9d2f6d12ea3"
    wheel_sha256: "88e95c70472154ee32233f76af126526db208830e1e803eb9f621c8bd1d8fcd0"
    license: "MIT"
    language: "Python"
    independent_engine: true
    roles: [client]
    published: true
    note: "Generic CIP and Rockwell Logix originator (CIPDriver, LogixDriver); no implicit messaging."


  libplctag:
    priority: P1
    status: implemented
    upstream: "libplctag"
    repository: "https://github.com/libplctag/libplctag"
    version: "2.7.2"             # release tag v2.7.2
    revision: "7712ed7f1ee05ba0ebfca641b3f5c43da52a66ed"   # tag commit
    source_sha256: "ed1f7869fa266df1bc266b9d135cd09d53dc392e557edb9986b2e172c84eb752"   # GitHub archive of the commit
    license: "MPL-2.0 OR LGPL-2.0-or-later"
    language: "C"
    independent_engine: true
    roles: [server, client]
    published: true
    note: >-
      Logix tag and generic CIP originator (libplctag, linked statically, used
      under MPL-2.0) and libplctag's ab_server PLC simulator serving the logix
      fixture's tags. ab_server has no ListIdentity, no Identity/Assembly
      objects, no tag list and no Read-Modify-Write.

  gologix:
    priority: P1
    status: implemented
    upstream: "gologix"
    repository: "https://github.com/danomagnum/gologix"
    module: "github.com/danomagnum/gologix"
    version: "0.44.0-beta"         # tag v0.44.0-beta (Go module version)
    revision: "647a0b87b756d42e37ac0f65c5762dc89036152c"   # tag commit
    source_sha256: "43a73e8d886e647f8edfbcbc3ce73b9209ac151a17a351effac10353bb4fc76f"   # GitHub archive of the commit
    module_sum: "h1:QrkDcR4ZFmtZ2lhWpdiE+8025nTwO4BulJkPZV+wsp8="   # go.sum, verified at build
    license: "MIT"
    language: "Go"
    independent_engine: true
    roles: [server, client]
    published: true
    dependencies:
      crc16: "github.com/npat-efault/crc16 v0.0.0-20161013170008-4128ccbe47c3 h1:LreEMrgwmSTNPbtao3jPZjwrjRYrlYTDg0kTMPOgSHg= (BSD-2-Clause)"
    note: >-
      Logix tag server (Class 3, Unconnected_Send) with Class 1 I/O, and a
      Class 3 originator: every client request goes over a Forward_Open
      connection; no UDP, no unconnected messaging, no templates.

  pylogix:
    priority: P1
    status: implemented
    upstream: "pylogix"
    repository: "https://github.com/dmroeder/pylogix"
    package: "pylogix"
    version: "1.1.6"            # PyPI wheel
    revision: "193b6c7b0c601619223ee53587abd821d3b344c1"
    wheel_sha256: "f181ff0990468c2e7fe0985be190c0bfe9c0d54dc4bb3f28f5a6d76b92cf980f"
    license: "Apache-2.0"
    language: "Python"
    independent_engine: true
    roles: [client]
    published: true
    note: "Rockwell Logix originator (PLC: Read/Write, GetTagList, Message, Discover, GetModuleProperties); generic messages unconnected only; no implicit messaging."

  etherip:
    priority: P1
    status: implemented
    upstream: "etherip"
    repository: "https://github.com/ornl-epics/etherip"
    version: "1.0-67"            # main, 67 commits after tag V1.0 (pom 1.0.0, EtherNetIP.version "1.4")
    revision: "ce0688ae51be5652ec200fbe389667b36a638323"
    source_sha256: "35ad2cbb710be5bef6cae0b2441a9397534249ddb33e9ac4e1e377b2e6546c7e"   # GitHub archive of the commit
    license: "EPL-1.0"
    language: "Java"
    independent_engine: true
    roles: [client]
    published: true
    note: >-
      The EPICS EtherNet/IP client: generic Get_Attribute_Single/All, ListIdentity,
      ListServices and Logix Read/Write Tag through Unconnected_Send to a backplane
      slot; no Set_Attribute, no Class 3 or Class 1 connections, no fragmented
      services, no tag list. The adapter (MIT) is compiled against the jar.

  eiprs:
    priority: P2
    status: implemented
    upstream: "rseip (eip-rs)"
    repository: "https://github.com/Joylei/eip-rs"
    package: "rseip"
    version: "0.3.1-2"           # main, crate 0.3.1 (untagged bump 4a305357) + 2 commits; git describe v0.3.0-6-g16e2236
    revision: "16e2236afb65acc9c82ebdcfbdcbba72e93b3887"
    source_sha256: "92cccb84822056e23ab93a2d200f11ebf7a3c6813648eaf081d653d2961da77b"   # GitHub archive of the commit
    license: "MIT"
    language: "Rust"
    independent_engine: true
    roles: [client]
    published: true
    note: >-
      Generic CIP and Rockwell Logix originator (EipClient/EipConnection,
      AbEipClient/AbEipConnection): unconnected, routed (Unconnected_Send) and
      Class 3 explicit messaging; no Class 1 I/O. Built with Rust
      1.98.1 from the commit's archive; crates.io dependencies pinned in
      adapters/eiprs/Cargo.lock.

  nodeeip:
    priority: P2
    status: implemented
    upstream: "node-ethernet-ip"
    repository: "https://github.com/cmseaton42/node-ethernet-ip"
    package: "ethernet-ip"
    version: "2.0.0"            # npm tarball, pinned by package-lock.json
    revision: "4743b077abd3cc8826d511acde8f890372826e16"
    npm_integrity: "sha512-jGxbu8ifv2qgPzaNKbyFmLaOaefrsg3aVsBWEj3BTWyGSfaVRx/MnkNJuiR/+41GzWgt/LZpYnFGJnAnjO7DCA=="
    tarball_sha256: "e6fb1334eb7d46136f94537f8fc6e5060174fbea9cf22c0af6fa5bed7c878506"
    license: "MIT"
    language: "TypeScript"
    independent_engine: true
    roles: [client]
    published: true
    note: "Logix originator (PLC: Read/Write Tag, Multiple Service Packet, RMW bits, tag list, templates) and generic CIP through its message builders; no implicit messaging, no Unconnected_Send."

  eeip:
    priority: P1
    status: implemented
    upstream: "EEIP.NET"
    repository: "https://github.com/rossmann-engineering/EEIP.NET"
    version: "1.6.0"              # master (no tags); AssemblyVersion of the library
    revision: "58b91a0c8e30227b1b97a637635d147a2a9655dc"
    source_sha256: "8ad4f3e498b6d02b1c65b8fae498100a9f9f90d6f691423e5c80559c4eceff5b"   # GitHub archive of the commit
    license: "MIT"
    language: "C#"
    independent_engine: true
    roles: [client]
    published: true
    note: "Scanner: explicit messaging and Class 1 I/O as originator (also T->O multicast and listen-only); no Class 3, no configuration data, no Multiple Service Packet."

