  maven_3_9_16_temurin_21_noble: "docker.io/library/maven:3.9.16-eclipse-temurin-21-noble@sha256:99e61abcff91a9b1333463bd8451fb18495d6eba9250ac66a338b518f8278320"
  temurin_21_0_13_jre_noble: "docker.io/library/eclipse-temurin:21.0.13_9-jre-noble@sha256:0d57a8e90c2bb844c5a8e1b2b71e11eff06dad7edcfd803cd21ed4ae203b2515"
  # used by: gologix, lokieip, cbsigma, otfabric (own/go-ethernetip)
  golang_1_27_4_trixie: "docker.io/library/golang:1.27.4-trixie@sha256:b54b2639de8c1bfe538ec5ffc45f29b1932235ac5f6d63c059853646677112d9"
  rust_1_100_0_slim_trixie: "docker.io/library/rust:1.100.0-slim-trixie@sha256:e9d95b74296f7126a83ae3d041aeaba1ff4c478f13abc5cc034fcf7c131c3d4a"
  node_24_22_3_trixie_slim: "docker.io/library/node:24.22.3-trixie-slim@sha256:af02d57b57719b9657a45199a79264a9437940cd55b3c7b3fc99615654f124a0"
  dotnet_sdk_10_0: "mcr.microsoft.com/dotnet/sdk:10.0@sha256:fe0fd4e93bd2fbb47c883b7a6369e5c8d3db8bf01cdc5981f6ee35fbdf3ff4fb"
  dotnet_runtime_10_0: "mcr.microsoft.com/dotnet/runtime:10.0@sha256:80a51954ac70925e5783cb1ed35129a4243dcb1cddef20066b67346e17db284d"

images:
  opener: "ghcr.io/otfabric/ethernetip-interop-opener"
  eipscanner: "ghcr.io/otfabric/ethernetip-interop-eipscanner"
  cpppo: "ghcr.io/otfabric/ethernetip-interop-cpppo"
  pycomm3: "ghcr.io/otfabric/ethernetip-interop-pycomm3"
  libplctag: "ghcr.io/otfabric/ethernetip-interop-libplctag"
  gologix: "ghcr.io/otfabric/ethernetip-interop-gologix"
  pylogix: "ghcr.io/otfabric/ethernetip-interop-pylogix"
  etherip: "ghcr.io/otfabric/ethernetip-interop-etherip"
  eiprs: "ghcr.io/otfabric/ethernetip-interop-eiprs"
  nodeeip: "ghcr.io/otfabric/ethernetip-interop-nodeeip"
  eeip: "ghcr.io/otfabric/ethernetip-interop-eeip"
